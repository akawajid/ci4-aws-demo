name: Deploy via SSM

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::428232898088:role/github-ssm-demo-role
          aws-region: ap-south-1

      - name: Find instance
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ci3-demo" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "instance_id=$instance_id" >> $GITHUB_ENV
          echo "Found instance: $instance_id"

      - name: Send deploy command
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ env.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters '{"commands":[
              "cd /var/www/html/app || exit 1",
              "git pull origin main",
              "sudo systemctl restart httpd"
            ]}' \
            --query "Command.CommandId" --output text)
          echo "command_id=$command_id" >> $GITHUB_ENV
          echo "SSM Command ID: $command_id"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          for i in $(seq 1 30); do
            status=$(aws ssm get-command-invocation \
              --command-id "${{ env.command_id }}" \
              --instance-id "${{ env.instance_id }}" \
              --query "Status" --output text)
            echo "Attempt $i/30: $status"
            if [[ "$status" == "Success" ]]; then
              echo "Final Status: Success"
              exit 0
            elif [[ "$status" == "Failed" || "$status" == "Cancelled" ]]; then
              echo "Final Status: $status"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment"
          exit 1
